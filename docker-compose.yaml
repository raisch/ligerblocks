services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 60s
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "25575:25575" # RCON port
      - "24454:24454" # Voice chat port
    environment:
      EULA: "TRUE"
      SEED: "5294879711726671709"
      TYPE: "MODRINTH"

      # --- Modpack (.mrpack) ---
      MODRINTH_MODPACK: "/modpacks/Ligerblocks.mrpack"

      # The loader (Fabric/Forge/NeoForge/Quilt) and Minecraft version are
      # read from the mrpack automatically; no TYPE or VERSION needed.

      # Include client-only optional mods? (default: required only)
      # MODRINTH_DEFAULT_EXCLUDE_INCLUDES: ""

      # Exclude mods that break on servers
      MODRINTH_EXCLUDE_FILES: "bits-n-bobs,wakes"

      # --- Server settings ---
      MEMORY: "16G"
      MOTD: "Welcome to LIGERBLOCKS!"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "PlazmaBoltz,CoachRob"
      EXISTING_WHITELIST_FILE: "MERGE"
      OPS: "PlazmaBoltz,CoachRob"
      TZ: "America/New_York"
      # --- Additional server settings ---
      ENABLE_RCON: "TRUE"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      SPAWN_PROTECTION: "0"
    volumes:
      - ./data:/data
      - ./modpacks:/modpacks:ro
  admin:
    build:
      context: ../minecraft-admin-portal
      dockerfile: Dockerfile
    container_name: minecraft-admin
    restart: unless-stopped

    env_file: 
      - ./.env
      - ../minecraft-admin-portal/.env

    environment:
      RCON_PASSWORD: "${RCON_PASSWORD:?Set RCON_PASSWORD in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - admin-data:/data

    depends_on:
      - minecraft

volumes:
  admin-data:
